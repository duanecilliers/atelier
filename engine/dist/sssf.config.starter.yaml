# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
#
# Stamped into this repo by Atelier (`install.py`). This file is YOURS: the
# installer stamps it once and the updater never touches it, so edit it freely —
# swap models, add agents, wire your quality commands. Everything the engine
# reads about your roster lives here.
#
# Native layout: the engine lives at adws/ in your repo root, so every path here
# is adws/-prefixed and ADWs run from the repo root:
#     uv run adws/adw_prompt.py --config adws/adw_sssf_config/sssf.config.yaml …
# repo_root() resolves to your repo root via `git rev-parse`.
defaults:
  # claude_code drives Claude through the Claude Agent SDK using your local
  # `claude` CLI's own login — no API key needed. That is why the starter roster
  # rides Claude: `just demo` works the moment you have the CLI logged in. Switch
  # an agent to `pi` (and set the provider key in .env) to run other models.
  coding_agent: claude_code
  model: anthropic/claude-sonnet-5   # provider/id
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # pi extensions loaded into the harness (-e); pi-only
  # Roster-wide tool allowlist; any agent may override with its own list.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents
    - find                         # find files by glob
    - ls                           # list directories
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the cockpit polls it
  poll_ms: 500                     # visualizer live-poll cadence

# Deterministic quality commands, keyed by name — the block list adw_modules/
# quality.py runs (map order is run order). Wire your repo's real checks here;
# argv is a LIST, never a shell string, and binaries are called by BARE NAME
# (they inherit your shell env). An absent quality: block runs nothing and says
# so — no fake green. Uncomment and edit for your stack, e.g.:
#
# quality:
#   test:      { argv: ["uv", "run", "pytest", "-q"], timeout: 600 }
#   lint:      { argv: ["ruff", "check", "."] }
#   typecheck: { argv: ["pyright"] }

agents:
  - name: planner
    model: anthropic/claude-fable-5
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the cockpit
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for the plan; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: builder
    model: anthropic/claude-sonnet-5
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    model: anthropic/claude-haiku-4-5
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    writes: []                     # read-only: its findings go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py — wire it in the quality: block above.

  - name: reviewer
    model: anthropic/claude-sonnet-5
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    model: anthropic/claude-haiku-4-5
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — repo-root-relative
      - app_docs/
      - docs/
      - "**/*.md"
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit
