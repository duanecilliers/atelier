# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
#
# Atelier layout: the engine lives in engine/ but shares the atelier repo's git
# root (no nested .git), so every path here is engine/-prefixed and ADWs are run
# from the atelier root:  uv run engine/adws/adw_prompt.py --config engine/adws/…
# repo_root() therefore resolves to the atelier root — the factory self-hosts.
defaults:
  coding_agent: pi
  model: openai-codex/gpt-5.6-sol   # provider/id. NB: anthropic OAuth is expired on this machine
                                    # (run `pi` re-auth to restore it), so the default rides openai-codex.
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # pi extensions loaded into the harness (-e)
  # Roster-wide allowlist; any agent may override with its own list.
  # NOTE: --tools filters extension and custom tools too, not just builtins. An agent
  # whose harness_engineering extension registers a tool MUST name that tool in its own
  # tools list — otherwise the extension loads and its tool is silently filtered out.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - engine/adws/adw_modules/
    - engine/adws/adw_sssf_config/
    - engine/adws/adw_*.py
  data_dir: engine/adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: engine/adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

# Deterministic quality commands, keyed by name — the block list adw_modules/
# quality.py runs (map order is run order). These are DATA: the invocation is
# the only per-repo thing about a check, so it lives here (config the operator
# owns) instead of in the managed quality.py. Rules: argv is a LIST, never a
# shell string; call binaries by BARE NAME (they inherit the operator's shell
# env). Omit a block to skip it; an empty/absent quality: block runs nothing and
# says so — no fake green.
#
# Atelier has no unit-test suite (so no `test` block — the test phase honestly
# reports "nothing run"); its real gates are the cockpit's typecheck + seam
# contract. Quality runs with cwd = repo root, so pnpm is pointed at cockpit/.
quality:
  typecheck: { argv: ["pnpm", "--dir", "cockpit", "typecheck"], area: frontend, operation: typecheck }
  contract:  { argv: ["pnpm", "--dir", "cockpit", "check:contract"], area: frontend }

# Sandbox provisioning — how a run gets an isolated, persistent workspace
# (docs/design/sandbox-runs.md). `default: local` keeps every run byte-identical
# to today: a run at the repo root, no worktree. A launch that picks a non-local
# LEVEL provisions per that level's profile ONCE at sandbox create (not per run),
# so follow-up runs start against a warm tree. `${SANDBOX_ID}`, `${BRANCH}`, and
# each allocated port name (`${WEB}`) interpolate into setup/env/services/land.
sandbox:
  default: local
  worktree_env:                       # L2: worktree + deps + ports + env
    branch: adw/${SANDBOX_ID}         # named branch the worktree checks out (survives teardown)
    setup:                            # shell commands, run once at create (cwd = the worktree)
      - pnpm --dir cockpit install --prefer-offline   # warm the cockpit deps for this sandbox
    ports:
      WEB: auto                       # a free port allocated per sandbox → $WEB, and injected env
    env:
      ATELIER_SANDBOX_WEB: ${WEB}     # every run in the sandbox sees its allocated port(s)
    # services (up/down) land in slice 3; land (pr|merge|manual) in slice 4.

agents:
  - name: planner
    coding_agent: claude_code          # plan D1: Claude planners run through the Agent SDK
    model: anthropic/claude-fable-5    # plan's stack: Opus 5 / Fable 5 planner, routed per complexity
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: engine/adws/adw_data/prompt_engineering/planner/system.md
      user: engine/adws/adw_data/prompt_engineering/planner/user.md
    harness_engineering:
      - engine/adws/adw_data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes:                        # the plan is the only thing it may leave in the repo.
      - specs/                     # repo-root-relative: matches where the planner's
                                   # prompt writes (cwd = repo_root = atelier root).
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    model: openai-codex/gpt-5.6-sol   # plan's stack: GPT-5.6 Sol builds
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: engine/adws/adw_data/prompt_engineering/builder/system.md
      user: engine/adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    coding_agent: claude_code           # via the Claude Agent SDK — uses Claude Code's
    model: anthropic/claude-haiku-4-5    # own auth, so Anthropic works despite pi's dead
                                         # OAuth. Sonnet 4 (anthropic/claude-sonnet-4-5)
                                         # is a heavier alternative for deeper recon.
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: engine/adws/adw_data/prompt_engineering/scout/system.md
      user: engine/adws/adw_data/prompt_engineering/scout/user.md
    harness_engineering:
      - engine/adws/adw_data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    model: openai-codex/gpt-5.6-terra
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: engine/adws/adw_data/prompt_engineering/reviewer/system.md
      user: engine/adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    model: openai-codex/gpt-5.6-luna
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: engine/adws/adw_data/prompt_engineering/documenter/system.md
      user: engine/adws/adw_data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — repo-root-relative, matching
      - app_docs/                  # where the documenter's prompt writes (cwd =
      - docs/                      # repo_root). "document only" is enforced here, not
      - "**/*.md"                  # left to a prompt line the model may drift from.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit
